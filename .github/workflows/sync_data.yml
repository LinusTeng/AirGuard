name: AirGuard Data Sync

on:
  schedule:
    - cron: '0 * * * *' 
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. 使用 v4 以上版本
      - name: 檢出代碼
        uses: actions/checkout@v4 

      # 2. 使用 v5 以上版本，並明確指定 Node 版本
      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          # 這行可以幫助一些舊套件在 Node 24 環境下更穩定
          cache: 'pip'

      - name: 安裝套件
        run: |
          pip install -r requirements.txt

      - name: 執行抓取腳本
        env:
          MY_API_KEY: ${{ secrets.MY_API_KEY }}
        run: |
          python ag.py

      - name: 提交並推回數據
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add airguard_all_taiwan_data.csv
          git commit -m "Auto-update AQI data: $(date)" || exit 0
          git push
