name: AirGuard Data Sync

on:
  schedule:
    - cron: '0 * * * *' 
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # 針對你看到的警告，強制使用 Node 24 環境（2026年標準）
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: 檢出代碼
        uses: actions/checkout@v4 # 升級到 v4

      - name: 設定 Python
        uses: actions/setup-python@v5 # 升級到 v5
        with:
          python-version: '3.9'

      - name: 安裝套件
        run: |
          pip install -r requirements.txt

      - name: 執行抓取腳本
        env:
          MY_API_KEY: ${{ secrets.MY_API_KEY }} 
        run: |
          python ag.py

      - name: 提交並推回數據
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add airguard_all_taiwan_data.csv
          # 加上 || true 確保即使沒有新數據（檔案沒變）也不會報錯
          git commit -m "Auto-update AQI data: $(date)" || true
          git push
